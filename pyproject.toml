[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "python-dotenv>=1.0", "neo4j>=5.20", "httpx>=0.27", "mcp>=2.3", "uvicorn>=0.30",
                "pyjwt>=2.8", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["claude-agent-sdk>=0.2"]
rag = ["fastembed>=0.8"]

[project.scripts]
lisa-graph-server = "lisa.servers.graph_server:main"
lisa-citation-verifier = "lisa.servers.citation_verifier:main"
lisa-analytics-server = "lisa.servers.analytics_server:main"
lisa-external-law-server = "lisa.servers.external_law_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"lisa.extract" = ["prompts/*.md", "schema_signatures.json"]
