# Phase 5 golden set. expected_cases = in-corpus case ids a complete answer must cite (recall target), taken from
# the deterministic graph (out/graph_all.json: CITES / MENTIONS_STATUTE edges, case metadata), so the ground truth
# is reproducible. expect: answer | refuse | disclaimer | status (answered, provenance-labelled, legal status never
# asserted).  setup: earlier turns asked first in the same research session (multi-turn memory).  needs_tools: tool-name substrings the KG agent's trajectory
# must contain (trajectory check).
questions:
  # ---- citing cases (graph traversal) ----
  - id: q01
    category: citing
    question: Which decisions in the corpus cite Pereira v. Sessions, 585 U.S. 198?
    expected_cases: [eoir_4008, eoir_4020, eoir_4028, eoir_4031, eoir_4034, eoir_4040, eoir_4050, eoir_4056,
                     eoir_4071, eoir_4079, scotus_2023_22-451, scotus_2023_22-674]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q02
    category: citing
    question: Which Board of Immigration Appeals decisions cite Matter of Arambula-Bravo, 28 I&N Dec. 388?
    expected_cases: [eoir_4031, eoir_4034, eoir_4040, eoir_4050, eoir_4056, eoir_4079]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q03
    category: citing
    question: Which cases cite Matter of J-F-F-, 23 I&N Dec. 912?
    expected_cases: [eoir_4023, eoir_4101, eoir_4130]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q04
    category: citing
    question: Which Supreme Court opinions in the corpus cite Gamble v. United States?
    expected_cases: [scotus_2019_18-1323, scotus_2019_18-5924, scotus_2019_18-877, scotus_2023_22-451,
                     scotus_2023_22-859]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q05
    category: citing
    question: Which opinions cite Franchise Tax Board of California v. Hyatt, 587 U.S. 230?
    expected_cases: [scotus_2018_17-646, scotus_2018_17-647, scotus_2019_18-1323, scotus_2019_18-5924,
                     scotus_2019_18-877, scotus_2020_19-1039, scotus_2023_22-451]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q06
    category: citing
    question: Which later decisions in the corpus cite Brown v. Davenport?
    expected_cases: [scotus_2021_21-418, scotus_2022_21-376, scotus_2023_22-451, scotus_2023_22-859,
                     scotus_2023_22-915]
    expect: answer
    needs_tools: [find_citing_cases]

  # ---- cross-domain: BIA decisions relying on Supreme Court precedent ----
  - id: q07
    category: cross_domain
    question: Which BIA decisions rely on Pereida v. Wilkinson and its burden-of-proof holding?
    expected_cases: [eoir_4020, eoir_4023, eoir_4025, eoir_4046, eoir_4223]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q08
    category: cross_domain
    question: Which immigration decisions cite United States v. Taylor, 596 U.S. 845?
    expected_cases: [eoir_3364, eoir_3390, eoir_3481, eoir_3797]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q09
    category: cross_domain
    question: How have BIA decisions in the corpus used Garland v. Ming Dai on credibility determinations?
    expected_cases: [eoir_4077, eoir_4130, eoir_4160]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q10
    category: cross_domain
    question: Which BIA decisions cite Sessions v. Dimaya on the residual clause of 18 U.S.C. 16(b)?
    expected_cases: [eoir_4063]
    expect: answer
    needs_tools: [find_citing_cases]
  - id: q11
    category: cross_domain
    question: Which BIA decisions apply Quarles v. United States or United States v. Stitt on burglary?
    expected_cases: [eoir_4025, eoir_4051, eoir_4063]
    expect: answer
  - id: q12
    category: cross_domain
    question: Trace the citation path from Matter of Laparra to Supreme Court precedent on notices to appear.
    expected_cases: [eoir_4034, scotus_2017_17-459]
    expect: answer
    needs_tools: [precedent_chain]
  - id: q13
    category: cross_domain
    question: Which Supreme Court opinions in the corpus cite BIA or Attorney General decisions, if any?
    expected_cases: []
    expect: answer
    needs_tools: [cross_corpus_bridges]

  # ---- statutes ----
  - id: q14
    category: statute
    question: Which decisions discuss 18 U.S.C. 16, the crime of violence definition?
    expected_cases: [eoir_3390, eoir_3481, eoir_3797, eoir_4063, scotus_2017_15-1498]
    expect: answer
  - id: q15
    category: statute
    question: Which decisions in the corpus address 8 U.S.C. 1229, the notice to appear requirements?
    expected_cases: [eoir_4008, eoir_4028, eoir_4031, eoir_4034, eoir_4050, eoir_4071, eoir_4079,
                     scotus_2017_17-459, scotus_2020_19-897, scotus_2023_22-674]
