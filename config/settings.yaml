out_dir: out
neo4j_uri: bolt://localhost:7687

llm:
  # Ollama Cloud direct (free tier; SharedLLM pool keys were failing upstream on 2026-10-01).
  # SharedLLM alternative: base_url https://api.sharedllm.com/openai/v1, auth sharedllm, api_key_env SHAREDLLM_API_KEY
  base_url: https://ollama.com/v1
  auth: bearer
  api_key_env: OLLAMA_API_KEY
  model: gpt-oss:120b
  temperature: 0
  max_output_tokens: 8192
  timeout_s: 180
  max_requests_per_run: 300
  window_pages: 3
  edge_split_chars: 60000
  include_unverified_in_graph: false
  json_mode: true
eval:
  match_threshold: 0.3
  fewshot_units: [eoir_4018__u1of1, scotus_2017_17-269__u1of1]
