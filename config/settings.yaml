out_dir: out
neo4j_uri: bolt://localhost:7687

llm:
  # Standard path (spec 4.2 / sharedllm.com/docs): SharedLLM gateway with the virtual key only (X-SharedLLM-Key, no
  # provider Authorization) -> the gateway serves from our contributed keys first, then the pool (debits balance).
  # The spec's z-ai/glm-flash-latest is served by the pool under the Custom provider as "~z-ai/glm-flash-latest"
  # (dashboard Playground -> Export). Without the "~" the gateway falls back to contributed keys and fails.
  base_url: https://api.sharedllm.com/custom-openai/v1
  auth: sharedllm
  api_key_env: SHAREDLLM_API_KEY
  model: "~z-ai/glm-flash-latest"
  temperature: 0
  max_output_tokens: 16384   # reasoning models spend output tokens on hidden reasoning
  reasoning: {max_tokens: 4096}   # glm-flash otherwise reasons until the cap (finish_reason length, empty answer)
  timeout_s: 180
  max_requests_per_run: 300
  workers: 3                 # parallel requests; SharedLLM/Ollama returns 429 "too many concurrent requests" at 2x6
  window_pages: 3
  edge_split_chars: 60000
  include_unverified_in_graph: false
  json_mode: true
eval:
  match_threshold: 0.3
  fewshot_units: [eoir_4018__u1of1, scotus_2017_17-269__u1of1]

serve:
  dataset: all                 # which deterministic graph the servers serve (out/graph_<dataset>.json)
  llm_graphs: [all]           # LLM-tier graph of the served cases (out/graph_all_llm.json, scripts/enrich_llm.py)
  backend: memory              # memory | neo4j
  host: 127.0.0.1
  ports: {graph: 8101, verifier: 8102, analytics: 8103, external: 8104}
auth:
  issuer: lisa-auth
  audience: lisa-mcp
  token_ttl_s: 28800
  secret_env: LISA_AUTH_SECRET  # HS256 signing secret (environment only)
courtlistener:
  base_url: https://www.courtlistener.com/api/rest/v4
  token_env: COURTLISTENER_TOKEN
  limits: {per_minute: 5, per_hour: 50, per_day: 125}
  timeout_s: 30
  max_retries: 3
agent:
  # Claude Agent SDK -> SharedLLM Anthropic-compatible route on the same provider/model as llm: (virtual key only)
  base_url: https://api.sharedllm.com/anthropic     # spec 4.3: Anthropic-compatible route; gateway translates
  model: "~z-ai/glm-flash-latest"
  max_turns: 30
  max_revisions: 2
  sessions_dir: sessions          # under out_dir; persisted research-session memory
