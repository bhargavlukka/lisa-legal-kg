out_dir: out
neo4j_uri: bolt://localhost:7687

llm:
  # Standard path (spec 4.2): SharedLLM gateway. Its pooled upstream keys are rejected (401/402, 2026-10-05), so we
  # send our own Ollama Cloud key as the provider bearer and the gateway forwards it (sharedllm.com/docs: "If you
  # omit [Authorization] the gateway injects a contributed or pooled key"). z-ai/glm-flash-latest is not served.
  base_url: https://api.sharedllm.com/ollama/v1
  auth: sharedllm_byok
  api_key_env: SHAREDLLM_API_KEY
  provider_key_env: OLLAMA_API_KEY
  model: gpt-oss:120b
  temperature: 0
  max_output_tokens: 16384   # gpt-oss spends output tokens on hidden reasoning
  timeout_s: 180
  max_requests_per_run: 300
  window_pages: 3
  edge_split_chars: 60000
  include_unverified_in_graph: false
  json_mode: true
eval:
  match_threshold: 0.3
  fewshot_units: [eoir_4018__u1of1, scotus_2017_17-269__u1of1]

serve:
  dataset: all                 # which deterministic graph the servers serve (out/graph_<dataset>.json)
  llm_graphs: [all]           # LLM-tier graph of the served cases (out/graph_all_llm.json, scripts/enrich_llm.py)
  backend: memory              # memory | neo4j
  host: 127.0.0.1
  ports: {graph: 8101, verifier: 8102, analytics: 8103, external: 8104}
auth:
  issuer: lisa-auth
  audience: lisa-mcp
  token_ttl_s: 28800
  secret_env: LISA_AUTH_SECRET  # HS256 signing secret (environment only)
courtlistener:
  base_url: https://www.courtlistener.com/api/rest/v4
  token_env: COURTLISTENER_TOKEN
  limits: {per_minute: 5, per_hour: 50, per_day: 125}
  timeout_s: 30
  max_retries: 3
agent:
  # Claude Agent SDK -> SharedLLM Anthropic-compatible route (same keys as llm:, sharedllm_byok)
  base_url: https://api.sharedllm.com/ollama
  model: gpt-oss:120b
  max_turns: 30
  max_revisions: 2
  sessions_dir: sessions          # under out_dir; persisted research-session memory
